  - id: worker-study-runtime-contract
    scope: repo
    repo: worker
    triggers:
      - path: crates/solver-worker/src/study/runtime*.rs
        kind: study-runtime
      - path: crates/solver-worker/src/bin/study_*.rs
        kind: study-runtime-binary
      - path: docs/agents/contracts/study-runtime-contract.md
        kind: study-runtime-contract
    requiredDocs:
