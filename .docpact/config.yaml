repo:
  id: worker
  owner: worker

rules:
  - id: worker-dependency-monitoring-contract
    scope: repo
    repo: worker
    triggers:
      - path: .github/dependabot.yml
        kind: dependency-monitoring-config
      - path: .github/workflows/python-validator.yml
        kind: python-dependency-validation
      - path: docs/agents/dependency-maintenance.md
        kind: dependency-maintainer-guide
    requiredDocs:
      - path: docs/agents/dependency-maintenance.md
        mode: review_or_update
    reason: Monitoring groups and scoped Python proof must agree with the maintenance guide without changing native, data, model or deployment qualification boundaries.
  - id: worker-bootstrap-contract
    scope: repo
    repo: worker
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/**
        kind: doc-ai-layer
      - path: docs/agents/repo-validation.md
        kind: deep-doc
      - path: docs/agents/repo-architecture.md
        kind: deep-doc
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Repo entry guidance, machine-readable routing, and retained source docs must stay aligned.
  - id: worker-readme-contract
    scope: repo
    repo: worker
    triggers:
      - path: README.md
        kind: repo-landing
      - path: .env.example
        kind: operator-env-template
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Repo landing text should stay aligned with the current contract and AI entry surface.
  - id: worker-study-method-assessment-contract
    scope: repo
    repo: worker
    triggers:
      - path: crates/solver-worker/src/study/method_assessment*
        kind: source-bound-method-assessment
