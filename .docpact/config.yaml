      - path: crates/solver-worker/src/bin/study_method_assess.rs
        kind: offline-method-candidate
      - path: scripts/*study_method*.py
        kind: independent-assessment-oracle
      - path: docs/agents/contracts/study-method-*.schema.json
        kind: assessment-schema
      - path: docs/agents/contracts/study-method-assessment-contract.md
        kind: assessment-contract
    requiredDocs:
