          - .github/workflows/ai-doc-lint.yml
          - .github/dependabot.yml
      ownerRepo: worker
    - id: solver-runtime-and-ci
      paths:
        include:
          - Cargo.toml
          - Makefile
          - crates/**
          - .github/workflows/ci.yml
      ownerRepo: worker
    - id: validation-debug-and-diagnostics-tooling
      paths:
        include:
          - scripts/**
          - tools/bw25-validator/**
          - .github/workflows/python-validator.yml
      ownerRepo: worker
    - id: runtime-sql-expectations
      paths:
