        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Exact method source adoption, frozen numerical predicates and explicit pending professional judgments need a separate assessment contract without changing legacy Run semantics.
  - id: worker-study-analysis-contract
    scope: repo
    repo: worker
    triggers:
      - path: crates/solver-worker/src/study/analysis*
        kind: numerical-analysis
      - path: crates/solver-worker/src/study/analysis/**
        kind: analysis-tests
      - path: crates/solver-worker/src/study/analysis_advanced/**
        kind: advanced-analysis-tests
      - path: crates/solver-worker/tests/fixtures/study-analysis/**
        kind: analysis-seam-and-codec
      - path: docs/agents/contracts/study-analysis*.schema.json
