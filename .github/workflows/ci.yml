name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - clippy.toml
      - rustfmt.toml
      - Makefile
      - crates/**
      - tools/**
      - scripts/**
      - .github/workflows/ci.yml
  schedule:
    # Weekly Monday 04:00 UTC keep-warm so refs/heads/main Rust cache never expires after 7 days.
    - cron: "0 4 * * 1"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify CI lane (fail-closed)
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$HAS_FULL_LABEL" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only="true"
          file_count=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            file_count=$((file_count + 1))
            case "$file" in
              AGENTS.md|README.md|docs/*|.docpact/*) ;;
              *)
                docs_only="false"
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          if [ "$file_count" -gt 0 ] && [ "$docs_only" = "true" ]; then
            echo "mode=docs-only" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

  python-contracts:
    needs: plan
    if: needs.plan.outputs.mode != 'docs-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Native cache identity tests
        run: python3 -m unittest scripts/test_ci_native_fingerprint.py
      - name: Manual validation target tests
        run: python3 -m unittest scripts/test_validate_lcia_targets.py
      - name: Study P0 independent qualification oracle
        run: make study-p0-check
      - name: Study method independent Decimal oracle
        run: make study-method-check
      - name: Install patchelf for local model package tests
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Local Model package contract tests
        run: PYTHONPATH=scripts python3 -m unittest scripts/test_package_model_runtime.py

  rust-lint:
    needs: plan
    if: needs.plan.outputs.mode != 'docs-only'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Install SuiteSparse dependencies
        run: sudo apt-get update && sudo apt-get install -y libsuitesparse-dev libopenblas-dev liblapack-dev pkg-config patchelf
      - name: Fingerprint installed native environment
        id: native
        run: python3 scripts/ci_native_fingerprint.py >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore dependency compilation cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: native-${{ steps.native.outputs.native_hash }}-${{ hashFiles('scripts/ci_native_fingerprint.py', 'scripts/test_ci_native_fingerprint.py', '.github/workflows/ci.yml', 'Makefile') }}
          add-rust-environment-hash-key: "true"
          env-vars: "PKG_CONFIG LD CARGO_PROFILE_DEV_DEBUG CARGO_PROFILE_TEST_DEBUG"
          cache-bin: "false"
          cache-workspace-crates: "false"
          cache-all-crates: "false"
          cache-on-failure: "false"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-build:
    needs: plan
    if: needs.plan.outputs.mode != 'docs-only'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install SuiteSparse dependencies
        run: sudo apt-get update && sudo apt-get install -y libsuitesparse-dev libopenblas-dev liblapack-dev pkg-config postgresql-client patchelf
      - name: Fingerprint installed native environment
        id: native
        run: python3 scripts/ci_native_fingerprint.py >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore dependency compilation cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The custom key precedes every restore prefix, including lockfile fallbacks.
          key: native-${{ steps.native.outputs.native_hash }}-${{ hashFiles('scripts/ci_native_fingerprint.py', 'scripts/test_ci_native_fingerprint.py', '.github/workflows/ci.yml', 'Makefile') }}
          add-rust-environment-hash-key: "true"
          env-vars: "PKG_CONFIG LD CARGO_PROFILE_DEV_DEBUG CARGO_PROFILE_TEST_DEBUG"
          cache-bin: "false"
          cache-workspace-crates: "false"
          cache-all-crates: "false"
          cache-on-failure: "false"
      - name: Test
        run: cargo test --workspace --all-features
      - name: Queue transport fault recovery
        env:
          WORKER_CLAIM_TEST_PORT: "5432"
        run: ./scripts/test_worker_claim_recovery.sh

  rust-study-qualification:
    needs: plan
    if: needs.plan.outputs.mode != 'docs-only'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Install SuiteSparse dependencies
        run: sudo apt-get update && sudo apt-get install -y libsuitesparse-dev libopenblas-dev liblapack-dev pkg-config patchelf
      - name: Fingerprint installed native environment
        id: native
        run: python3 scripts/ci_native_fingerprint.py >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore dependency compilation cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: native-${{ steps.native.outputs.native_hash }}-${{ hashFiles('scripts/ci_native_fingerprint.py', 'scripts/test_ci_native_fingerprint.py', '.github/workflows/ci.yml', 'Makefile') }}
          add-rust-environment-hash-key: "true"
          env-vars: "PKG_CONFIG LD CARGO_PROFILE_DEV_DEBUG CARGO_PROFILE_TEST_DEBUG"
          cache-bin: "false"
          cache-workspace-crates: "false"
          cache-all-crates: "false"
          cache-on-failure: "false"
      - name: Study advanced native component qualification
        env:
          RUST_TEST_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          cargo test --locked -p solver-worker --lib linux_exit_rss_race_reconciles_actual_child -- --ignored --nocapture
          cargo build --locked -p solver-worker --bin study_native
          STUDY_NATIVE_BINARY="$PWD/target/debug/study_native" \
            STUDY_ADVANCED_QUALIFICATION_RECEIPT="$RUNNER_TEMP/study-advanced-component.json" \
            cargo test --locked -p solver-worker --lib advanced_native_capacity_and_running_cancellation -- --ignored --nocapture

  rust:
    if: always()
    needs: [plan, python-contracts, rust-lint, rust-build, rust-study-qualification]
    runs-on: ubuntu-latest
    steps:
      - name: Verify worker CI gates
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PYTHON_RESULT: ${{ needs.python-contracts.result }}
          LINT_RESULT: ${{ needs.rust-lint.result }}
          RUST_RESULT: ${{ needs.rust-build.result }}
          STUDY_RESULT: ${{ needs.rust-study-qualification.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = "success"
          if [ "$MODE" = "docs-only" ]; then
            test "$PYTHON_RESULT" = "skipped" -o "$PYTHON_RESULT" = "success"
            test "$LINT_RESULT" = "skipped" -o "$LINT_RESULT" = "success"
            test "$RUST_RESULT" = "skipped" -o "$RUST_RESULT" = "success"
            test "$STUDY_RESULT" = "skipped" -o "$STUDY_RESULT" = "success"
          else
            test "$PYTHON_RESULT" = "success"
            test "$LINT_RESULT" = "success"
            test "$RUST_RESULT" = "success"
            test "$STUDY_RESULT" = "success"
          fi
